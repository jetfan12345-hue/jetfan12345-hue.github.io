<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Don — Pages</title>
  <meta name="description" content="Personal GitHub Pages for Don Hubbard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #12151a;
      --paper: #e8ebe4;
      --muted: #6d7568;
      --line: rgba(18, 21, 26, 0.12);
      --accent: #2f6b4f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--ink);
      font-family: Figtree, sans-serif;
      background:
        radial-gradient(1200px 600px at 12% -10%, rgba(47, 107, 79, 0.18), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(90, 110, 70, 0.12), transparent 50%),
        linear-gradient(180deg, #f3f5f0 0%, var(--paper) 45%, #dfe4d8 100%);
    }

    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: clamp(3.5rem, 12vw, 7rem) 1.5rem 4rem;
    }

    .brand {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(3.2rem, 12vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 0.95;
      margin: 0 0 0.75rem;
      animation: rise 0.7s ease both;
    }

    .lede {
      margin: 0 0 2.75rem;
      max-width: 28ch;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.5;
      animation: rise 0.7s ease 0.08s both;
    }

    nav {
      display: grid;
      gap: 0;
      border-top: 1px solid var(--line);
      animation: rise 0.7s ease 0.16s both;
    }

    a.item {
      display: grid;
      gap: 0.2rem;
      padding: 1.15rem 0;
      border-bottom: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
      transition: padding-left 0.2s ease, color 0.2s ease;
    }

    a.item:hover,
    a.item:focus-visible {
      color: var(--accent);
      padding-left: 0.4rem;
      outline: none;
    }

    .name {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.35rem;
      font-weight: 500;
    }

    .desc {
      color: var(--muted);
      font-size: 0.95rem;
    }

    a.item:hover .desc,
    a.item:focus-visible .desc {
      color: inherit;
      opacity: 0.75;
    }

    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.85rem;
      animation: rise 0.7s ease 0.24s both;
    }

    footer a { color: inherit; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="brand">Don</h1>
    <p class="lede">Personal pages — wedding day boards, Core Forge, and a solar-dryer demo.</p>
    <nav aria-label="Projects">
      <a class="item" href="aug22.html">
        <span class="name">Aug 22 day board</span>
        <span class="desc">Concord Estate schedule map — who is where</span>
      </a>
      <a class="item" href="photo.html">
        <span class="name">Photographer board</span>
        <span class="desc">Shot list by time for Aug 22</span>
      </a>
      <a class="item" href="coreforge/">
        <span class="name">Core Forge</span>
        <span class="desc">Follow-along ab training app</span>
      </a>
      <a class="item" href="sunline/">
        <span class="name">SunLine X1</span>
        <span class="desc">Solar dryer product demo</span>
      </a>
    </nav>
    <footer>
      <p>© <span id="year"></span> · <a href="https://github.com/jetfan12345-hue/jetfan12345-hue.github.io">Source</a></p>
    </footer>
  </main>
  <script>
    document.getElementById("year").textContent = String(new Date().getFullYear());
  </script>
</body>
</html>
