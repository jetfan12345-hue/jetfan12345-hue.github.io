<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Aug 22" />
  <meta name="theme-color" content="#161018" />
  <title>Aug 22 — Concord Estate</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --ink: #1b1520;
      --paper: #f6f1e8;
      --gold: #c4a35a;
      --purple: #7b3fa0;
      --red: #c0392b;
      --groom: #2c4a6e;
      --don: #1e3a5f;
      --photo: #3d5a40;
      --vendor: #b8860b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; height: 100dvh; font-family: "Iowan Old Style", Palatino, Georgia, serif; background: var(--ink); color: var(--paper); }
    #app { display: flex; height: 100%; }
    aside {
      width: 340px;
      min-width: 270px;
      overflow: auto;
      padding: 18px 16px calc(28px + env(safe-area-inset-bottom));
      background: #161018;
      border-right: 1px solid #3a2f28;
    }
    h1 { font-size: 1.38rem; margin: 0 0 4px; letter-spacing: .02em; }
    .sub { color: #c9b8a0; font-size: .82rem; margin: 0 0 14px; line-height: 1.35; }
    h2 {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--gold);
      margin: 18px 0 8px;
    }
    .times { list-style: none; margin: 0; padding: 0; }
    .times button {
      width: 100%;
      text-align: left;
      background: #221c24;
      color: var(--paper);
      border: 1px solid #3a3036;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 6px;
      min-height: 44px;
      cursor: pointer;
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .times button:hover,
    .times button.on { background: #3a2a44; border-color: var(--gold); }
    .times .t { display: block; font-weight: 700; color: var(--gold); font-size: .78rem; }
    .times .n { display: block; font-size: .94rem; }
    .times .marks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
    .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 10px; font-size: .84rem; }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .sym svg, .legend svg, .marks svg, .who-row svg { width: 54px; height: 54px; display: block; }
    .who-row { display: flex; gap: 6px; align-items: center; filter: drop-shadow(0 1px 2px #0008); }
    #who {
      margin: 10px 0 4px;
      padding: 12px 14px;
      background: #2a2230;
      border: 1px solid #c4a35a;
      border-radius: 8px;
      color: var(--paper);
    }
    #who > div { margin: 0 0 8px; font-size: 1rem; font-weight: 700; color: var(--gold); }
    #who ul { margin: 0; padding-left: 1.15em; font-size: 1rem; line-height: 1.45; }
    #who li { margin: 0 0 6px; }
    #map-clip {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      position: relative;
    }
    #map {
      position: absolute;
      width: 220%;
      height: 220%;
      left: -60%;
      top: -50%;
    }
    .leaflet-tooltip.place { font-family: inherit; font-size: 11px; font-weight: 700; opacity: .95; }
    .note { font-size: .78rem; color: #c9b8a0; margin-top: 16px; line-height: 1.4; }
    @media (max-width: 720px) {
      #app { flex-direction: column; }
      #map-clip { height: 52%; min-height: 240px; }
      aside {
        width: 100%;
        height: 48%;
        border-right: 0;
        border-top: 1px solid #3a2f28;
        padding: 12px 14px calc(16px + env(safe-area-inset-bottom));
      }
      h1 { font-size: 1.15rem; }
      .sub { margin-bottom: 8px; }
      h2 { margin: 10px 0 6px; }
      .times { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
      .times li { flex: 0 0 auto; }
      .times button { width: auto; min-width: 132px; margin-bottom: 0; }
      .note { margin-top: 10px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside>
      <h1>Aug 22 — Concord Estate</h1>
      <p class="sub">Saturday · 2090 Roberts Mountain Rd, Roseburg, OR · tap a time to see who is where</p>
      <h2>Times</h2>
      <ul class="times" id="times"></ul>
      <div id="who"></div>
      <h2>Who</h2>
      <div class="legend" id="legend"></div>
      <p class="note">4:00 bartender at the pool · catering at reception · golden hour is couple + photographer only.</p>
    </aside>
    <div id="map-clip">
      <div id="map"></div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const house = [43.11124, -123.37774];
    const spots = {
      ready: [43.11145, -123.37777],
      bride: [43.11145, -123.37777],
      grooms: [43.11145, -123.37789],
      first: [43.11117, -123.37780],
      firstLook: [43.11117, -123.37780],
      ceremony: [43.11165, -123.37779],
      reception: [43.11109, -123.37823],
      pool: [43.11100, -123.37785],
      views: [43.11117, -123.37780],
      kitchen: [43.11109, -123.37823],
      dance: [43.11109, -123.37823]
    };
    const places = [
      { name: "Ceremony", key: "ceremony" },
      { name: "Grooms", key: "grooms" },
      { name: "Bride", key: "ready" },
      { name: "First look", key: "first" },
      { name: "Reception", key: "reception" },
      { name: "Pool", key: "pool" }
    ];
    const people = {
      raechell: { label: "Raechell", kind: "crown", color: "#7C3AED" },
      don: { label: "Don", kind: "dot", color: "#1E3A8A" },
      bridesmaids: { label: "Bridesmaids", kind: "dot", color: "#F9A8D4" },
      grooms: { label: "Grooms", kind: "dot", color: "#38BDF8" },
      kathy: { label: "Kathy", kind: "dot", color: "#E11D48" },
      stevah: { label: "Stevah", kind: "dot", color: "#9CA3AF" },
      photo: { label: "Photo", kind: "cam", color: "#F59E0B" },
      dj: { label: "DJ", kind: "tri", color: "#F97316" },
      caterer: { label: "Caterer", kind: "tri", color: "#0D9488" },
      flowers: { label: "Flowers", kind: "tri", color: "#22C55E" },
      bar: { label: "Bar", kind: "tri", color: "#EAB308" }
    };
    const slots = [
      { t: "9:00", n: "Arrive — Get ready. DJ on tables, cloths, chairs.", who: [["raechell","bride"],["bridesmaids","bride"],["don","grooms"],["grooms","grooms"],["flowers","ceremony"],["kathy","reception"],["bar","reception"],["dj","reception"]], notes: ["Raechell, Bridesmaids at Bride", "Don, Grooms at Grooms", "Flowers at Ceremony", "Kathy, Bar, DJ at Reception"] },
      { t: "9:30–11:00", n: "Getting-ready photos", who: [["raechell","bride"],["bridesmaids","bride"],["photo","bride"],["don","grooms"],["grooms","grooms"],["photo","grooms"],["flowers","ceremony"],["kathy","reception"],["dj","reception"]], notes: ["Raechell, Bridesmaids, Photo at Bride", "Don, Grooms, Photo at Grooms", "Flowers at Ceremony", "Kathy, DJ at Reception"] },
      { t: "11:15", n: "First look — Donnie and Raechell", who: [["raechell","firstLook"],["don","firstLook"],["photo","firstLook"],["bridesmaids","bride"],["grooms","grooms"],["kathy","reception"],["dj","reception"]], notes: ["Raechell, Don, Photo at first look", "Bridesmaids at Bride", "Grooms at Grooms", "Kathy, DJ at Reception"] },
      { t: "11:25–12:00", n: "Couple, then Judy and Stevah", who: [["raechell","firstLook"],["don","firstLook"],["stevah","firstLook"],["photo","firstLook"],["bridesmaids","bride"],["grooms","grooms"],["kathy","reception"],["dj","reception"]], notes: ["Raechell, Don, Stevah, Photo at first look", "Bridesmaids at Bride", "Grooms at Grooms", "Kathy, DJ at Reception"] },
      { t: "12:10–1:15", n: "Don and Raechell first, then the bride and groom party, then parents and relatives", who: [["raechell","firstLook"],["don","firstLook"],["bridesmaids","firstLook"],["grooms","firstLook"],["stevah","firstLook"],["kathy","firstLook"],["photo","firstLook"],["caterer","reception"],["bar","reception"]], notes: ["Raechell, Don, Bridesmaids, Grooms, Stevah, Kathy, Photo at first look", "Caterer, Bar at Reception"] },
      { t: "1:30–2:00", n: "Guests arrive, get seated, ceremony", who: [["raechell","ceremony"],["don","ceremony"],["bridesmaids","ceremony"],["grooms","ceremony"],["stevah","ceremony"],["kathy","ceremony"],["photo","ceremony"],["dj","ceremony"],["flowers","ceremony"],["caterer","reception"],["bar","reception"]], notes: ["Raechell, Don, Bridesmaids, Grooms, Stevah, Kathy, Photo, DJ, Flowers at Ceremony", "Caterer, Bar at Reception"] },
      { t: "2:15–2:30", n: "Don and Raechell first, then greeting and starting seating", who: [["raechell","reception"],["don","reception"],["photo","reception"],["caterer","reception"],["bar","reception"],["dj","reception"]], notes: ["Raechell, Don, Photo, Caterer, Bar, DJ at Reception"] },
      { t: "3:15", n: "Dinner — Tables called one at a time", who: [["raechell","reception"],["don","reception"],["caterer","reception"],["bar","reception"],["dj","reception"]], notes: ["Raechell, Don, Caterer, Bar, DJ at Reception"] },
      { t: "4:00", n: "After dinner — Guests out by the pool", who: [["raechell","pool"],["don","pool"],["photo","pool"],["dj","pool"],["bar","pool"],["caterer","reception"]], notes: ["Raechell, Don, Photo, DJ, Bar at Pool", "Caterer at Reception"] },
      { t: "6:30", n: "Golden hour — Last portraits", who: [["raechell","ceremony"],["don","ceremony"],["photo","ceremony"]], notes: ["Raechell, Don, Photo at Ceremony"] }
    ];

    function svgFor(p) {
      return {
        crown: `<svg viewBox="0 0 24 24"><path fill="${p.color}" d="M5 16l-2-9 5 4 4-7 4 7 5-4-2 9H5zm0 2h14v2H5z"/></svg>`,
        cam: `<svg viewBox="0 0 24 24"><path fill="${p.color}" d="M9 4h6l1.2 2H20v14H4V6h4.8L9 4zm3 13a4 4 0 100-8 4 4 0 000 8z"/></svg>`,
        tri: `<svg viewBox="0 0 24 24"><path fill="${p.color}" d="M12 3l10 18H2L12 3z"/></svg>`,
        dot: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="${p.color}"/></svg>`
      }[p.kind];
    }

    const map = L.map("map", {
      zoomControl: true,
      attributionControl: false,
      closePopupOnClick: false,
      zoomSnap: 1,
      minZoom: 19,
      maxZoom: 19
    }).setView(house, 19);

    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19,
      maxNativeZoom: 19
    }).addTo(map);

    places.forEach(function (p) {
      L.marker(spots[p.key], {
        icon: L.divIcon({ className: "", html: "", iconSize: [1, 1], iconAnchor: [0, 0] }),
        interactive: false
      }).addTo(map).bindTooltip(p.name, {
        className: "place",
        permanent: true,
        direction: "center",
        offset: [0, 0]
      });
    });

    const layer = L.layerGroup().addTo(map);
    let current = 0;

    function draw(i) {
      current = i;
      layer.clearLayers();
      const slot = slots[i];
      const byLoc = {};
      slot.who.forEach(function (entry) {
        const loc = entry[1];
        (byLoc[loc] = byLoc[loc] || []).push(people[entry[0]]);
      });
      Object.keys(byLoc).forEach(function (loc) {
        const list = byLoc[loc];
        const w = list.length * 60 - 6;
        L.marker(spots[loc], {
          icon: L.divIcon({
            className: "",
            html: `<div class="who-row">${list.map(svgFor).join("")}</div>`,
            iconSize: [w, 54],
            iconAnchor: [w / 2, -16]
          }),
          interactive: false
        }).addTo(layer);
      });
      document.querySelectorAll(".times button").forEach(function (b, idx) {
        b.classList.toggle("on", idx === i);
      });
      const box = document.getElementById("who");
      box.innerHTML = `<div>${slot.t}</div><ul>${slot.notes.map(function (line) {
        return `<li>${line}</li>`;
      }).join("")}</ul>`;
    }

    const legend = document.getElementById("legend");
    Object.keys(people).forEach(function (k) {
      const p = people[k];
      const span = document.createElement("span");
      span.innerHTML = `${svgFor(p)} ${p.label}`;
      legend.appendChild(span);
    });

    const ul = document.getElementById("times");
    slots.forEach(function (s, i) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      const seen = {};
      const marks = s.who.map(function (entry) {
        const k = entry[0];
        if (seen[k]) return "";
        seen[k] = true;
        return svgFor(people[k]);
      }).join("");
      b.innerHTML = `<span class="t">${s.t}</span><span class="n">${s.n}</span><span class="marks">${marks}</span>`;
      b.onclick = function () { draw(i); };
      li.appendChild(b);
      ul.appendChild(li);
    });
    draw(current);
    function lockFrame() {
      map.invalidateSize();
      map.fitBounds(L.latLngBounds([
        spots.ceremony, spots.grooms, spots.bride,
        spots.firstLook, spots.reception, spots.pool
      ]), { padding: [8, 8], maxZoom: 19, animate: false });
    }
    setTimeout(lockFrame, 200);
    window.addEventListener("resize", lockFrame);
  </script>
</body>
</html>
